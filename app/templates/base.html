<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SchemaChef{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF6EE;
    --paper-dim: #F1EBDD;
    --ink: #2B2A25;
    --muted: #6B6A5F;
    --green: #3F5D46;
    --green-dark: #2E4534;
    --gold: #B4863A;
    --line: #E3DCC9;
    --error: #A6402F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 1.1rem 1.5rem;
    border-bottom: 2px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0;
    color: var(--green-dark);
  }
  nav a {
    color: var(--green-dark);
    text-decoration: none;
    margin-left: 1rem;
    font-size: 0.9rem;
    border-bottom: 1px solid transparent;
  }
  nav a:hover { border-bottom-color: var(--green-dark); }
  .lang-switch {
    background: transparent;
    border: 1px solid transparent;
    color: var(--green-dark);
    font-size: 0.8rem;
    padding: 0.15rem 0.4rem;
    margin-left: 0.5rem;
    cursor: pointer;
    border-radius: 3px;
  }
  .lang-switch:hover { border-color: var(--line); }
  .lang-switch[aria-current="true"] {
    background: var(--green);
    color: #fff;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  h2 {
    font-weight: 700;
    color: var(--green-dark);
  }
  h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.4rem;
    margin-top: 2.2rem;
  }
  .flash {
    padding: 0.75rem 1rem;
    border-radius: 4px;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }
  .flash.success { background: #E4EEE2; color: var(--green-dark); border: 1px solid var(--green); }
  .flash.error { background: #F5E4E0; color: var(--error); border: 1px solid var(--error); }
  label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    display: block;
    margin-bottom: 0.2rem;
  }
  /* Echte Eingabefelder: klar als editierbar erkennbar (Kontrast,
     leichter Schatten), unterscheidbar von reinem Erklaertext/Legenden. */
  input[type=text], input[type=url], textarea, select {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 1.5px solid var(--line);
    border-radius: 5px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
    box-shadow: inset 0 1px 2px rgba(43,42,37,0.05);
  }
  input[type=text]:focus, input[type=url]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(63,93,70,0.15);
  }
  input[readonly] {
    background: var(--paper-dim);
    color: var(--muted);
    box-shadow: none;
  }
  button, .btn {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 0.6rem 1.1rem;
    border-radius: 4px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    display: inline-block;
    text-decoration: none;
  }
  button:hover { background: var(--green-dark); }
  .btn-ghost {
    background: transparent;
    color: var(--green-dark);
    border: 1px solid var(--green);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--line); }
  .badge {
    font-size: 0.65rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: var(--gold);
    color: #fff;
    margin-left: 0.3rem;
  }
  .meta { font-size: 0.85rem; color: var(--muted); }
  .actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; align-items: center; }

  /* Wiederverwendbares 2-Spalten-Muster: links Feld, rechts Erklaerung -
     wie bei der Legende, jetzt durchgaengig. */
  .field-row {
    display: grid;
    grid-template-columns: minmax(0, 320px) 1fr;
    gap: 1.5rem;
    align-items: start;
    margin-bottom: 1.3rem;
  }
  .field-row .help-col {
    font-size: 0.85rem;
    color: var(--muted);
    padding-top: 1.55rem;
  }
  @media (max-width: 720px) {
    .field-row { grid-template-columns: 1fr; }
    .field-row .help-col { padding-top: 0.3rem; }
  }

  /* Legenden/Erklaer-Boxen: bewusst NICHT wie ein Eingabefeld (kein
     weisser Hintergrund, kein voller Rahmen) - stattdessen Akzentlinie. */
  details.varlegend {
    background: transparent;
    border: none;
    border-left: 3px solid var(--gold);
    padding: 0.1rem 0 0.1rem 0.9rem;
    margin: 0.5rem 0 1rem;
    font-size: 0.8rem;
  }
  details.varlegend summary {
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
    list-style: revert;
  }
  details.varlegend dt {
    font-family: ui-monospace, monospace;
    color: var(--green-dark);
    font-weight: 600;
    margin-top: 0.5rem;
  }
  details.varlegend dt:first-child { margin-top: 0.5rem; }
  details.varlegend dd { margin: 0.05rem 0 0; color: var(--muted); }
  details.varlegend p { margin: 0.6rem 0 0; color: var(--muted); }
</style>
{% block extra_style %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<header>
  <h1>SchemaChef</h1>
  <nav>
    <a href="{{ url_for('index') }}">{{ _('Neues Rezept') }}</a>
    <a href="{{ url_for('history') }}">{{ _('Verlauf') }}</a>
    <a href="{{ url_for('admin') }}">{{ _('Einstellungen') }}</a>
    <form method="post" action="{{ url_for('set_language', lang='de') }}" style="display:inline">
      <button type="submit" class="lang-switch" {% if get_locale()|string == 'de' %}aria-current="true"{% endif %}>DE</button>
    </form>
    <form method="post" action="{{ url_for('set_language', lang='en') }}" style="display:inline">
      <button type="submit" class="lang-switch" {% if get_locale()|string == 'en' %}aria-current="true"{% endif %}>EN</button>
    </form>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
